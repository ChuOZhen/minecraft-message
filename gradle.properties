# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# 26.1 起 Minecraft Java 版源码不再混淆，Fabric 已弃用 Yarn。
# 因此这里没有 yarn_mappings / mappings 行，Loom 直接使用官方未混淆名称。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
version=1.0.0
maven_group=com.msgboard
archives_base_name=msgboard

# Dependencies
fabric_api_version=0.161.0+26.3
